<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abberant</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: linear-gradient(F
          135deg,
          #0a0a0a 0%,
          #1a1a2e 25%,
          #16213e 50%,
          #0f3460 75%,
          #0a0a0a 100%
        );
        font-family: "Orbitron", monospace;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        animation: backgroundShift 20s ease-in-out infinite;
      }

      @keyframes backgroundShift {
        0%,
        100% {
          background: linear-gradient(
            135deg,
            #0a0a0a 0%,
            #1a1a2e 25%,
            #16213e 50%,
            #0f3460 75%,
            #0a0a0a 100%
          );
        }
        50% {
          background: linear-gradient(
            135deg,
            #0f3460 0%,
            #0a0a0a 25%,
            #1a1a2e 50%,
            #16213e 75%,
            #0f3460 100%
          );
        }
      }

      #gameContainer {
        position: relative;
        width: 800px;
        height: 600px;
        border: 3px solid #00ffff;
        border-radius: 15px;
        overflow: hidden;
        background: #0a0a0a;
        box-shadow: 0 0 30px rgba(0, 255, 255, 0.5),
          inset 0 0 30px rgba(0, 255, 255, 0.1);
        animation: containerGlow 3s ease-in-out infinite alternate;
      }

      @keyframes containerGlow {
        0% {
          box-shadow: 0 0 30px rgba(0, 255, 255, 0.5),
            inset 0 0 30px rgba(0, 255, 255, 0.1);
        }
        100% {
          box-shadow: 0 0 50px rgba(0, 255, 255, 0.8),
            inset 0 0 50px rgba(0, 255, 255, 0.2);
        }
      }

      #gameCanvas {
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: pixelated;
      }

      #ui {
        position: absolute;
        top: 15px;
        left: 15px;
        color: #00ffff;
        font-size: 16px;
        font-weight: 700;
        z-index: 10;
        text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
        backdrop-filter: blur(10px);
        background: rgba(0, 255, 255, 0.1);
        padding: 10px 15px;
        border-radius: 10px;
        border: 1px solid rgba(0, 255, 255, 0.3);
      }

      #controls {
        color: #ffff00;
        font-size: 12px;
        font-weight: 400;
        text-shadow: 0 0 8px rgba(255, 255, 0, 0.8);
        background: rgba(255, 255, 0, 0.1);
        padding: 15px 20px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 0, 0.3);
        margin-top: 20px;
        line-height: 1.6;
      }

      #startScreen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(20px);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        color: #00ffff;
        z-index: 100;
      }

      #startScreen h1 {
        font-size: 48px;
        font-weight: 900;
        text-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
        margin-bottom: 20px;
      }

      #startScreen button {
        margin: 20px;
        padding: 20px 40px;
        font-size: 20px;
        font-weight: 700;
        background: linear-gradient(45deg, #00ffff, #ff00ff);
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-family: "Orbitron", monospace;
        text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
      }

      #startScreen button:hover {
        transform: scale(1.05);
        box-shadow: 0 0 30px rgba(0, 255, 255, 0.6),
          0 0 30px rgba(255, 0, 255, 0.6);
      }

      #gameOverScreen {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(20px);
        padding: 40px;
        border-radius: 20px;
        text-align: center;
        color: #ff0000;
        font-size: 24px;
        font-weight: 900;
        z-index: 100;
        display: none;
        border: 2px solid #ff0000;
        box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
      }

      #gameOverScreen button {
        margin: 10px;
        padding: 15px 25px;
        font-size: 16px;
        font-weight: 700;
        background: linear-gradient(45deg, #ff0000, #ff6600);
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-family: "Orbitron", monospace;
      }

      #gameOverScreen button:hover {
        transform: scale(1.05);
        box-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
      }

      #pauseScreen {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(20px);
        padding: 40px;
        border-radius: 20px;
        text-align: center;
        color: #00ffff;
        font-size: 24px;
        font-weight: 900;
        z-index: 100;
        display: none;
        border: 2px solid #00ffff;
        box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
      }

      #mobileControls {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 120px;
        display: none;
        z-index: 15;
        pointer-events: none;
      }

      .mobile-button {
        position: absolute;
        background: rgba(0, 255, 255, 0.2);
        border: 2px solid #00ffff;
        border-radius: 50%;
        color: #00ffff;
        font-size: 16px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        touch-action: manipulation;
        pointer-events: all;
        transition: all 0.1s ease;
        backdrop-filter: blur(10px);
        box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
      }

      .mobile-button:active {
        background: rgba(0, 255, 255, 0.5);
        transform: scale(0.95);
        box-shadow: 0 0 25px rgba(0, 255, 255, 0.6);
      }

      .dpad {
        bottom: 20px;
        left: 20px;
        width: 120px;
        height: 120px;
        position: relative;
      }

      .dpad-center {
        position: absolute;
        top: 40px;
        left: 40px;
        width: 40px;
        height: 40px;
        background: rgba(0, 255, 255, 0.1);
        border: 2px solid #00ffff;
        border-radius: 50%;
        backdrop-filter: blur(10px);
      }

      .dpad-up,
      .dpad-down,
      .dpad-left,
      .dpad-right {
        position: absolute;
        width: 40px;
        height: 40px;
      }

      .dpad-up {
        top: 0;
        left: 40px;
      }
      .dpad-down {
        bottom: 0;
        left: 40px;
      }
      .dpad-left {
        left: 0;
        top: 40px;
      }
      .dpad-right {
        right: 0;
        top: 40px;
      }

      .action-buttons {
        bottom: 20px;
        right: 20px;
        width: 120px;
        height: 120px;
        position: absolute;
      }

      .jump-button {
        position: absolute;
        top: 0;
        right: 0;
        width: 60px;
        height: 60px;
        font-size: 12px;
        background: rgba(0, 255, 0, 0.2);
        border-color: #00ff00;
        color: #00ff00;
      }

      .dash-button {
        position: absolute;
        bottom: 0;
        right: 30px;
        width: 50px;
        height: 50px;
        font-size: 10px;
        background: rgba(255, 0, 255, 0.2);
        border-color: #ff00ff;
        color: #ff00ff;
      }

      .pause-button {
        position: absolute;
        top: 15px;
        right: 50%;
        transform: translateX(50%);
        width: 40px;
        height: 40px;
        font-size: 12px;
        background: rgba(255, 255, 0, 0.2);
        border-color: #ffff00;
        color: #ffff00;
      }

      @media (max-width: 768px) {
        #gameContainer {
          width: 100vw;
          height: 100vh;
          border: none;
          border-radius: 0;
        }
        #mobileControls {
          display: block !important;
        }
        .mobile-button {
          z-index: 20;
          opacity: 0.9;
        }
      }

      #progressBar {
        position: absolute;
        bottom: 15px;
        right: 15px;
        width: 200px;
        height: 20px;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid #00ffff;
        border-radius: 10px;
        overflow: hidden;
        backdrop-filter: blur(10px);
      }

      #progressFill {
        height: 100%;
        background: linear-gradient(90deg, #00ffff, #ff00ff);
        width: 0%;
        transition: width 0.3s ease;
        border-radius: 10px;
      }

      #soundToggle {
        position: absolute;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(255, 255, 0, 0.1);
        border: 1px solid rgba(255, 255, 0, 0.3);
        color: #ffff00;
        padding: 8px 12px;
        border-radius: 8px;
        font-family: "Orbitron", monospace;
        font-size: 12px;
        cursor: pointer;
        backdrop-filter: blur(10px);
        transition: all 0.3s ease;
      }

      #soundToggle:hover {
        background: rgba(255, 255, 0, 0.2);
        transform: translateX(-50%) scale(1.05);
      }
    </style>
  </head>
  <body>
    <div id="gameContainer">
      <canvas id="gameCanvas" width="800" height="600"></canvas>

      <div id="ui">
        <div>Lives: <span id="lives">3</span></div>
        <div>Score: <span id="score">0</span></div>
        <div>Level: <span id="level">1</span></div>
        <div>Combo: <span id="combo">0</span></div>
      </div>

      <button id="soundToggle">🔊 Sound: ON</button>

      <div id="progressBar">
        <div id="progressFill"></div>
      </div>

      <div id="startScreen">
        <h1>Abberant</h1>
        <button id="startButton">Start Game</button>
        <div id="controls">
          WASD/Arrow Keys: Move | Space: Jump | Shift: Dash | P: Pause | R:
          Reset
        </div>
      </div>

      <div id="gameOverScreen">
        <h2>Game Over!</h2>
        <p>Final Score: <span id="finalScore">0</span></p>
        <p>Best Combo: <span id="bestCombo">0</span></p>
        <button onclick="game.restart()">Play Again</button>
      </div>

      <div id="pauseScreen">
        <h2>Paused</h2>
        <p>Press P to continue</p>
      </div>

      <div id="mobileControls">
        <div class="dpad">
          <div class="dpad-center"></div>
          <div class="mobile-button dpad-up" data-action="up">↑</div>
          <div class="mobile-button dpad-down" data-action="down">↓</div>
          <div class="mobile-button dpad-left" data-action="left">←</div>
          <div class="mobile-button dpad-right" data-action="right">→</div>
        </div>

        <div class="action-buttons">
          <div class="mobile-button jump-button" data-action="jump">JUMP</div>
          <div class="mobile-button dash-button" data-action="dash">DASH</div>
          <div class="mobile-button pause-button" data-action="pause">⏸</div>
        </div>
      </div>
    </div>

    <script>
      class PolishedTrippySideScroller {
        constructor() {
          this.canvas = document.getElementById("gameCanvas");
          this.ctx = this.canvas.getContext("2d");
          this.width = 800;
          this.height = 600;
          window.game = this;

          this.setupAudio();
          this.init();
        }

        init() {
          this.gameState = "start";
          this.currentLevel = 1;
          this.lives = 3;
          this.score = 0;
          this.combo = 0;
          this.bestCombo = 0;
          this.paused = false;

          // --- NEW --- Flag for 'backwards' mode
          this.isReversed = false;

          this.player = {
            x: 100,
            y: 400,
            width: 20,
            height: 20,
            velX: 0,
            velY: 0,
            speed: 6,
            jumpPower: 16,
            grounded: false,
            doubleJump: false,
            dashCooldown: 0,
            invulnerable: 0,
            color: "#00ffff",
            trail: [],
          };
          this.camera = { x: 0, y: 0, targetX: 0, targetY: 0, smoothing: 0.1 };
          this.keys = {};
          this.gamepadInput = {
            left: false,
            right: false,
            jump: false,
            dash: false,
          };
          this.touchInput = {
            left: false,
            right: false,
            jump: false,
            dash: false,
          };

          if (!this.inputSetupDone) {
            this.setupInput();
            this.setupMobileControls();
            this.setupGamepadSupport();
            this.setupSoundToggle();
            this.inputSetupDone = true;
          }

          // --- UPDATED --- Added pulseFactor for new effect
          this.effects = {
            glitchOffset: { x: 0, y: 0 },
            meltingFactor: 0,
            colorShift: 0,
            pulseFactor: 1,
            blurFactor: 0,
            noiseFactor: 0,
            rgbShiftFactor: 0,
            waveFactor: 0,
            zoomFactor: 0,
            rotationFactor: 0,
            pixelBleedFactor: 0,
            dreamFactor: 0,
            dreamWaveFactor: 0,
          };
          this.levelProgress = 0;
          this.levelTarget = 1800;

          this.platforms = [];
          this.enemies = [];
          this.collectibles = [];
          this.backgroundStars = [];

          this.dataBleedEffects = [];
          this.transitionTimer = 0;
          this.levelEffects = [];

          this.frameCount = 0;
          this.lastTime = performance.now();
          this.fps = 60;

          document.getElementById("startScreen").style.display = "flex";
          document.getElementById("gameOverScreen").style.display = "none";
          document.getElementById("pauseScreen").style.display = "none";

          this.generateLevel();

          if (!this.animationFrameId) {
            this.gameLoop();
          }
        }

        startGame() {
          if (this.gameState !== "start") return;
          this.gameState = "playing";
          document.getElementById("startScreen").style.display = "none";
          this.initAudioContext();
        }

        generateBackground() {
          this.backgroundStars = [];
          const starCount = 200;
          const levelWidth = 2000 + this.currentLevel * 500;
          for (let i = 0; i < starCount; i++) {
            this.backgroundStars.push({
              x: Math.random() * levelWidth,
              y: Math.random() * this.height,
              size: Math.random() * 2 + 0.5,
              parallax: Math.random() * 0.5 + 0.1,
              hue: Math.random() * 60 + 180,
            });
          }
        }

        updateBGMEffects() {
          if (!this.soundEnabled || this.paused) return;
          const time = Date.now() / 2000;
          const modulation = Math.sin(time);
          this.bgmTempo = 500 + modulation * 200;
          this.bgmPitchMod = 1.0 + Math.sin(time * 4) * 0.05;
        }

        restart() {
          this.init();
        }

        setupAudio() {
          this.audioCtx = null;
          this.soundEnabled = true;
          this.audioInitialized = false;
          this.bgmTimeoutId = null;
          this.bgmTempo = 500;
          this.bgmPitchMod = 1.0;
          this.delayNode = null;
          this.feedbackGain = null;
          this.masterGain = null;
        }

        initAudioContext() {
          if (this.audioInitialized) return;
          if (!this.audioCtx) {
            this.audioCtx = new (window.AudioContext ||
              window.webkitAudioContext)();
          }
          if (this.audioCtx.state === "suspended") this.audioCtx.resume();
          this.masterGain = this.audioCtx.createGain();
          this.delayNode = this.audioCtx.createDelay(1.0);
          this.feedbackGain = this.audioCtx.createGain();
          this.delayNode.delayTime.value = 0.25;
          this.feedbackGain.gain.value = 0.4;
          this.masterGain.connect(this.delayNode);
          this.masterGain.connect(this.audioCtx.destination);
          this.delayNode.connect(this.audioCtx.destination);
          this.delayNode.connect(this.feedbackGain);
          this.feedbackGain.connect(this.delayNode);
          this.audioInitialized = true;
          this.startBGM();
        }

        playSound(type) {
          if (!this.soundEnabled || !this.audioCtx) return;
          const now = this.audioCtx.currentTime;
          const gainNode = this.audioCtx.createGain();
          gainNode.connect(this.audioCtx.destination);
          const oscillator = this.audioCtx.createOscillator();
          oscillator.connect(gainNode);
          switch (type) {
            case "jump":
              gainNode.gain.setValueAtTime(0.2, now);
              gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
              oscillator.frequency.setValueAtTime(440, now);
              oscillator.frequency.exponentialRampToValueAtTime(880, now + 0.2);
              break;
            case "dash":
              gainNode.gain.setValueAtTime(0.3, now);
              gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
              oscillator.type = "sawtooth";
              oscillator.frequency.setValueAtTime(100, now);
              oscillator.frequency.exponentialRampToValueAtTime(
                1200,
                now + 0.4
              );
              break;
            case "collect":
              gainNode.gain.setValueAtTime(0.2, now);
              gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
              oscillator.frequency.setValueAtTime(880, now);
              oscillator.frequency.exponentialRampToValueAtTime(
                1760,
                now + 0.15
              );
              break;
            case "stomp":
              gainNode.gain.setValueAtTime(0.4, now);
              gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
              oscillator.type = "square";
              oscillator.frequency.setValueAtTime(400, now);
              oscillator.frequency.exponentialRampToValueAtTime(200, now + 0.3);
              break;
            case "hit":
              gainNode.gain.setValueAtTime(0.5, now);
              gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
              oscillator.type = "sawtooth";
              oscillator.frequency.setValueAtTime(200, now);
              oscillator.frequency.exponentialRampToValueAtTime(50, now + 0.5);
              break;
          }
          oscillator.start(now);
          oscillator.stop(now + 1);
        }

        scheduleNextNote() {
          if (!this.soundEnabled || !this.audioCtx || this.paused) return;
          const now = this.audioCtx.currentTime;
          const notes = [220.0, 261.63, 329.63, 392.0];
          const note = notes[Math.floor(Math.random() * notes.length)];
          const gainNode = this.audioCtx.createGain();
          gainNode.connect(this.masterGain);
          gainNode.gain.setValueAtTime(0.08, now);
          gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
          const oscillator = this.audioCtx.createOscillator();
          oscillator.connect(gainNode);
          oscillator.type = "triangle";
          oscillator.frequency.setValueAtTime(note * this.bgmPitchMod, now);
          oscillator.start(now);
          oscillator.stop(now + 0.5);
          this.bgmTimeoutId = setTimeout(
            () => this.scheduleNextNote(),
            this.bgmTempo
          );
        }

        startBGM() {
          this.stopBGM();
          if (this.soundEnabled && this.audioInitialized && !this.paused)
            this.scheduleNextNote();
        }

        stopBGM() {
          if (this.bgmTimeoutId) {
            clearTimeout(this.bgmTimeoutId);
            this.bgmTimeoutId = null;
          }
        }

        setupInput() {
          document
            .getElementById("startButton")
            .addEventListener("click", () => this.startGame());
          document.addEventListener("keydown", (e) => {
            if (this.gameState === "start" && e.key === "Enter") {
              this.startGame();
              return;
            }
            this.keys[e.key.toLowerCase()] = true;
            if (
              e.key === " " ||
              e.key === "ArrowUp" ||
              e.key.toLowerCase() === "w"
            ) {
              this.jump();
              e.preventDefault();
            }
            if (e.key.toLowerCase() === "shift") {
              this.dash();
              e.preventDefault();
            }
            if (e.key.toLowerCase() === "p") {
              this.togglePause();
              e.preventDefault();
            }
            if (e.key.toLowerCase() === "r") {
              this.restart();
            } // Changed to restart for full reset
          });
          document.addEventListener("keyup", (e) => {
            this.keys[e.key.toLowerCase()] = false;
          });
        }

        setupMobileControls() {
          const mobileButtons = document.querySelectorAll(".mobile-button");
          mobileButtons.forEach((button) => {
            const action = button.getAttribute("data-action");
            const handleStart = (e) => {
              e.preventDefault();
              this.handleMobileInput(action, true);
            };
            const handleEnd = (e) => {
              e.preventDefault();
              this.handleMobileInput(action, false);
            };
            button.addEventListener("touchstart", handleStart);
            button.addEventListener("touchend", handleEnd);
          });
        }

        handleMobileInput(action, pressed) {
          if (this.gameState === "start") {
            this.startGame();
            return;
          }
          if (this.gameState !== "playing") return;
          switch (action) {
            case "left":
              this.touchInput.left = pressed;
              break;
            case "right":
              this.touchInput.right = pressed;
              break;
            case "jump":
              if (pressed) this.jump();
              break;
            case "dash":
              if (pressed) this.dash();
              break;
            case "pause":
              if (pressed) this.togglePause();
              break;
          }
        }

        setupGamepadSupport() {
          this.gamepadIndex = null;
          this.gamepadDeadzone = 0.3;
          this.gamepadButtonPressed = {};
          window.addEventListener("gamepadconnected", (e) => {
            this.gamepadIndex = e.gamepad.index;
          });
          window.addEventListener("gamepaddisconnected", () => {
            this.gamepadIndex = null;
          });
        }

        setupSoundToggle() {
          document
            .getElementById("soundToggle")
            .addEventListener("click", () => {
              if (this.gameState === "start") this.startGame();
              if (!this.audioInitialized) this.initAudioContext();
              this.soundEnabled = !this.soundEnabled;
              document.getElementById("soundToggle").textContent = this
                .soundEnabled
                ? "🔊 Sound: ON"
                : "🔇 Sound: OFF";
              if (this.soundEnabled) {
                this.startBGM();
              } else {
                this.stopBGM();
              }
            });
        }

        updateGamepadInput() {
          if (this.gamepadIndex === null) return;
          const gamepad = navigator.getGamepads()[this.gamepadIndex];
          if (!gamepad) return;
          if (
            this.gameState === "start" &&
            gamepad.buttons.some((b) => b.pressed)
          ) {
            this.startGame();
            return;
          }
          const leftStickX = gamepad.axes[0];
          const dpadLeft = gamepad.buttons[14].pressed;
          const dpadRight = gamepad.buttons[15].pressed;
          this.gamepadInput.left =
            leftStickX < -this.gamepadDeadzone || dpadLeft;
          this.gamepadInput.right =
            leftStickX > this.gamepadDeadzone || dpadRight;
          const jumpButton = gamepad.buttons[0];
          if (jumpButton.pressed && !this.gamepadButtonPressed.jump)
            this.jump();
          this.gamepadButtonPressed.jump = jumpButton.pressed;
          const dashButton = gamepad.buttons[1];
          if (dashButton.pressed && !this.gamepadButtonPressed.dash)
            this.dash();
          this.gamepadButtonPressed.dash = dashButton.pressed;
          const pauseButton = gamepad.buttons[9];
          if (
            pauseButton &&
            pauseButton.pressed &&
            !this.gamepadButtonPressed.pause
          )
            this.togglePause();
          this.gamepadButtonPressed.pause = pauseButton
            ? pauseButton.pressed
            : false;
        }

        generateLevel() {
          this.platforms = [];
          this.enemies = [];
          this.collectibles = [];
          this.assignLevelEffects();

          const levelWidth = 2000 + this.currentLevel * 500;
          this.levelTarget = levelWidth;
          this.generateBackground();

          // --- UPDATED --- Set player start position based on 'backwards' effect
          this.player.x = this.isReversed ? this.levelTarget - 100 : 100;
          this.player.y = 400;

          const platformCount = 15 + this.currentLevel * 3;
          
          // Add spawn platform based on backwards mode
          if (this.isReversed) {
            // In backwards mode, add a platform near the player spawn point (right side)
            this.platforms.push({
              x: this.levelTarget - 150,
              y: 550,
              width: 200,
              height: 50,
              color: "#ff00ff",
              type: "normal",
            });
          } else {
            // Normal mode - platform at left side
            this.platforms.push({
              x: 0,
              y: 550,
              width: 200,
              height: 50,
              color: "#ff00ff",
              type: "normal",
            });
          }
          for (let i = 1; i < platformCount; i++) {
            const x =
              (i * levelWidth) / platformCount + Math.random() * 100 - 50;
            const y = 200 + Math.sin(i * 0.5) * 150 + Math.random() * 100;
            const width = 80 + Math.random() * 120;
            this.platforms.push({
              x,
              y,
              width,
              height: 20,
              color: `hsl(${(i * 30) % 360}, 70%, 50%)`,
              type: "normal",
            });
          }
          for (let i = 0; i < 5 + this.currentLevel; i++) {
            const platform =
              this.platforms[Math.floor(Math.random() * this.platforms.length)];
            this.enemies.push({
              x: platform.x + Math.random() * platform.width,
              y: platform.y - 15,
              width: 15,
              height: 15,
              velX: Math.random() < 0.5 ? 1 : -1,
              speed: 1 + Math.random(),
              color: `hsl(${Math.random() * 360}, 100%, 50%)`,
            });
          }
          for (let i = 0; i < 8 + this.currentLevel; i++) {
            const platform =
              this.platforms[Math.floor(Math.random() * this.platforms.length)];
            this.collectibles.push({
              x: platform.x + Math.random() * platform.width,
              y: platform.y - 30,
              width: 12,
              height: 12,
              color: "#ffff00",
              collected: false,
              value: 100,
            });
          }
        }

        // --- UPDATED --- Added new effects to the pool
        assignLevelEffects() {
          const effectPool = [
            "glitch",
            "melting",
            "invert",
            "chromatic", // Original
            "upsideDown",
            "backwards",
            "pulsing",
            "wobble",
            "scanlines", // New
          ];
          this.levelEffects = [];
          this.isReversed = false;

          for (let i = effectPool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [effectPool[i], effectPool[j]] = [effectPool[j], effectPool[i]];
          }
          const effectCount = Math.random() > 0.6 ? 2 : 1;

          for (let i = 0; i < effectCount && i < effectPool.length; i++) {
            this.levelEffects.push(effectPool[i]);
          }

          // --- NEW --- Set the reversed flag if 'backwards' is chosen
          if (this.levelEffects.includes("backwards")) {
            this.isReversed = true;
          }
        }

        nextLevel() {
          this.gameState = "transition";
          this.transitionTimer = 180;
          this.stopBGM();
        }

        setupNewLevel() {
          this.currentLevel++;
          this.score += 1000 * this.currentLevel;
          this.resetLevel(false);
          this.gameState = "playing";
          this.startBGM();
        }

        update() {
          if (this.paused) return;
          switch (this.gameState) {
            case "start":
              this.updateGamepadInput();
              break;
            case "playing":
              this.updateGame();
              break;
            case "transition":
              this.transitionTimer--;
              if (this.transitionTimer <= 0) this.setupNewLevel();
              break;
            case "gameover":
              break;
          }
        }

        // --- UPDATED --- Level progress logic now accounts for backwards mode
        updateGame() {
          this.updateBGMEffects();
          this.updateGamepadInput();
          if (this.player.dashCooldown > 0) this.player.dashCooldown--;
          if (this.player.invulnerable > 0) this.player.invulnerable--;
          this.handleInput();
          this.updatePlayer();
          this.updateEnemies();
          this.updateEffects();
          this.updateDataBleed();
          this.updateCamera();
          this.checkCollisions();
          this.updateUI();

          if (this.isReversed) {
            this.levelProgress =
              ((this.levelTarget - this.player.x) / this.levelTarget) * 100;
            if (this.player.x <= 100) this.nextLevel();
          } else {
            this.levelProgress = (this.player.x / this.levelTarget) * 100;
            if (this.levelProgress >= 100) this.nextLevel();
          }
        }

        // --- UPDATED --- Controls are not affected by 'backwards' mode, only by 'invert'
        handleInput() {
          const leftPressed =
            this.keys["a"] ||
            this.keys["arrowleft"] ||
            this.gamepadInput.left ||
            this.touchInput.left;
          const rightPressed =
            this.keys["d"] ||
            this.keys["arrowright"] ||
            this.gamepadInput.right ||
            this.touchInput.right;

          if (leftPressed) {
            this.player.velX = -this.player.speed;
          } else if (rightPressed) {
            this.player.velX = this.player.speed;
          } else this.player.velX *= 0.8;

          if (this.levelEffects.includes("invert")) this.player.velX *= -1;
        }

        jump() {
          if (this.paused || this.gameState !== "playing") return;
          if (this.player.grounded) {
            this.player.velY = -this.player.jumpPower;
            this.player.grounded = false;
            this.player.doubleJump = true;
            this.playSound("jump");
          } else if (this.player.doubleJump) {
            this.player.velY = -this.player.jumpPower * 0.8;
            this.player.doubleJump = false;
            this.playSound("jump");
          }
        }

        dash() {
          if (
            this.paused ||
            this.player.dashCooldown !== 0 ||
            this.gameState !== "playing"
          )
            return;
          this.playSound("dash");
          const dashPower = 15;
          let direction = this.keys["a"] || this.keys["arrowleft"] ? -1 : 1;
          this.player.velX = direction * dashPower;
          this.player.dashCooldown = 60;
        }

        updatePlayer() {
          this.player.velY += 0.8;
          this.player.x += this.player.velX;
          this.player.y += this.player.velY;
          this.player.trail.push({ x: this.player.x, y: this.player.y });
          if (this.player.trail.length > 10) this.player.trail.shift();
          if (!this.isReversed && this.player.x < 0) this.player.x = 0;
          if (this.isReversed && this.player.x > this.levelTarget)
            this.player.x = this.levelTarget;
          if (this.player.y > this.height + 100) this.respawn();
        }

        updateEnemies() {
          this.enemies.forEach((enemy) => {
            enemy.x += enemy.velX * enemy.speed;
            const onPlatform = this.platforms.find(
              (p) =>
                enemy.x >= p.x &&
                enemy.x <= p.x + p.width &&
                enemy.y >= p.y - enemy.height &&
                enemy.y <= p.y
            );
            if (
              onPlatform &&
              (enemy.x <= onPlatform.x ||
                enemy.x + enemy.width >= onPlatform.x + onPlatform.width)
            )
              enemy.velX *= -1;
          });
        }

        // --- UPDATED --- Handles the new 'pulsing' effect
        updateEffects() {
          if (!this.levelEffects.includes("glitch"))
            this.effects.glitchOffset = { x: 0, y: 0 };
          if (!this.levelEffects.includes("melting"))
            this.effects.meltingFactor = 0;
          if (!this.levelEffects.includes("chromatic"))
            this.effects.colorShift = 0;
          if (!this.levelEffects.includes("pulsing"))
            this.effects.pulseFactor = 1;

          if (this.levelEffects.includes("glitch"))
            this.effects.glitchOffset = {
              x: (Math.random() - 0.5) * 10,
              y: (Math.random() - 0.5) * 10,
            };
          if (this.levelEffects.includes("melting"))
            this.effects.meltingFactor = Math.sin(Date.now() * 0.01) * 0.1;
          if (this.levelEffects.includes("chromatic"))
            this.effects.colorShift = (Date.now() * 0.01) % (Math.PI * 2);
          if (this.levelEffects.includes("pulsing"))
            this.effects.pulseFactor = 0.7 + Math.sin(Date.now() * 0.005) * 0.3; // Pulse between 0.4 and 1.0

          // Update dream effects based on level effects
          const hasDreamEffects = this.levelEffects.includes("melting") || 
                                 this.levelEffects.includes("dataBleed") || 
                                 this.levelEffects.includes("wobble");
          
          this.effects.dreamFactor = hasDreamEffects ? 1.0 : 0.0;
          this.effects.dreamWaveFactor = hasDreamEffects ? 0.8 : 0.0;
        }

        updateDataBleed() {
          this.dataBleedEffects = this.dataBleedEffects.filter((effect) => {
            effect.duration--;
            return effect.duration > 0;
          });
        }

        updateCamera() {
          this.camera.targetX = this.player.x - this.width / 3;
          this.camera.x +=
            (this.camera.targetX - this.camera.x) * this.camera.smoothing;
          this.camera.x = Math.max(
            0,
            Math.min(this.camera.x, this.levelTarget - this.width)
          );
        }

        checkCollisions() {
          this.player.grounded = false;
          this.platforms.forEach((p) => {
            if (
              this.player.x < p.x + p.width &&
              this.player.x + this.player.width > p.x &&
              this.player.y + this.player.height > p.y &&
              this.player.y < p.y
            ) {
              if (this.player.velY >= 0) {
                this.player.y = p.y - this.player.height;
                this.player.velY = 0;
                this.player.grounded = true;
                this.player.doubleJump = false;  // Reset double jump when grounded
                this.combo = 0;
              }
            }
          });
          this.enemies.forEach((enemy, index) => {
            if (
              this.player.x < enemy.x + enemy.width &&
              this.player.x + this.player.width > enemy.x &&
              this.player.y < enemy.y + enemy.height &&
              this.player.y + this.player.height > enemy.y
            ) {
              if (this.player.invulnerable > 0) return;
              if (
                this.player.velY > 0 &&
                this.player.y + this.player.height < enemy.y + enemy.height
              ) {
                this.triggerDataBleed(enemy.x, enemy.y);
                this.enemies.splice(index, 1);
                this.score += 250;
                this.combo++;
                if (this.combo > this.bestCombo) this.bestCombo = this.combo;
                this.player.velY = -this.player.jumpPower * 0.6;
                this.playSound("stomp");
              } else {
                this.respawn();
              }
            }
          });
          this.collectibles.forEach((c) => {
            if (
              !c.collected &&
              this.player.x < c.x + c.width &&
              this.player.x + this.player.width > c.x &&
              this.player.y < c.y + c.height &&
              this.player.y + this.player.height > c.y
            ) {
              c.collected = true;
              this.score += c.value;
              this.playSound("collect");
            }
          });
        }

        triggerDataBleed(x, y) {
          const duration = this.combo >= 5 ? 60 : 20;
          this.dataBleedEffects.push({
            x: x,
            y: y,
            duration: duration,
            size: Math.random() * 80 + 50,
          });
        }

        // --- UPDATED --- Respawn logic accounts for backwards mode
        respawn() {
          this.lives--;
          this.combo = 0;
          this.playSound("hit");
          if (this.lives <= 0) {
            this.gameState = "gameover";
            document.getElementById("finalScore").textContent = this.score;
            document.getElementById("bestCombo").textContent = this.bestCombo;
            document.getElementById("gameOverScreen").style.display = "flex";
            this.stopBGM();
          } else {
            this.player.x = this.isReversed ? this.levelTarget - 100 : 100;
            this.player.y = 400;
            this.player.velX = 0;
            this.player.velY = 0;
            this.player.grounded = false;
            this.player.doubleJump = false;  // Reset double jump on respawn
            this.player.invulnerable = 120;
          }
        }

        resetLevel(fullReset = true) {
          if (fullReset) {
            this.score = 0;
            this.lives = 3;
            this.combo = 0;
            this.currentLevel = 1;
            this.isReversed = false;
          }
          this.player.velX = 0;
          this.player.velY = 0;
          this.generateLevel();
        }

        togglePause() {
          if (this.gameState !== "playing" && !this.paused) return;
          this.paused = !this.paused;
          document.getElementById("pauseScreen").style.display = this.paused
            ? "block"
            : "none";
          if (this.paused) {
            this.stopBGM();
          } else {
            this.startBGM();
          }
        }

        renderBackground() {
          this.ctx.fillStyle = "#0a0a0a";
          this.ctx.fillRect(0, 0, this.width, this.height);
          const isChromatic = this.levelEffects.includes("chromatic");
          if (isChromatic) {
            this.ctx.globalCompositeOperation = "lighter";
            this.renderBackgroundLayer(0.06, "red");
            this.renderBackgroundLayer(0.0, "lime");
            this.renderBackgroundLayer(-0.06, "blue");
            this.ctx.globalCompositeOperation = "source-over";
          } else {
            this.renderBackgroundLayer(0);
          }
        }

        renderBackgroundLayer(parallaxOffset = 0, tint = null) {
          const camX = this.camera.x * (1 + parallaxOffset);
          this.backgroundStars.forEach((star) => {
            const drawX = (star.x - camX * star.parallax) % this.width;
            const wrappedX = drawX < 0 ? drawX + this.width : drawX;
            this.ctx.fillStyle = tint || `hsl(${star.hue}, 80%, 70%)`;
            this.ctx.fillRect(wrappedX, star.y, star.size, star.size);
          });
        }

        // --- UPDATED --- Applies all new visual effects during render
        render() {
          if (this.gameState === "transition") {
            this.renderMoireTunnel();
            return;
          }

          this.ctx.save();
          if (this.levelEffects.includes("upsideDown")) {
            this.ctx.translate(0, this.height);
            this.ctx.scale(1, -1);
          }
          if (this.levelEffects.includes("glitch"))
            this.ctx.translate(
              this.effects.glitchOffset.x,
              this.effects.glitchOffset.y
            );
          if (this.levelEffects.includes("invert"))
            this.ctx.filter = "invert(1) hue-rotate(180deg)";
          if (this.levelEffects.includes("melting"))
            this.ctx.transform(1, this.effects.meltingFactor, 0, 1, 0, 0);

          this.renderBackground();
          this.renderDataBleed();

          this.ctx.translate(-this.camera.x, -this.camera.y);

          const now = Date.now();
          const wobbleActive = this.levelEffects.includes("wobble");
          const pulsingActive = this.levelEffects.includes("pulsing");

          // Draw platforms
          this.platforms.forEach((p) => {
            const yOffset = wobbleActive
              ? Math.sin(p.x * 0.05 + now * 0.002) * 5
              : 0;
            if (pulsingActive) {
              this.ctx.save();
              this.ctx.globalAlpha = this.effects.pulseFactor;
            }
            this.ctx.fillStyle = this.levelEffects.includes("chromatic")
              ? `hsl(${
                  ((this.effects.colorShift * 180) / Math.PI) % 360
                }, 100%, 50%)`
              : p.color;
            this.ctx.fillRect(p.x, p.y + yOffset, p.width, p.height);
            if (pulsingActive) {
              this.ctx.restore();
            }
          });

          // Draw enemies, collectibles, and player with wobble
          const drawWobbled = (obj) => {
            const yOffset = wobbleActive
              ? Math.sin(obj.x * 0.05 + now * 0.002) * 5
              : 0;
            this.ctx.fillRect(obj.x, obj.y + yOffset, obj.width, obj.height);
          };

          this.enemies.forEach((e) => {
            this.ctx.fillStyle = e.color;
            drawWobbled(e);
          });
          this.collectibles.forEach((c) => {
            if (!c.collected) {
              this.ctx.fillStyle = c.color;
              drawWobbled(c);
            }
          });

          this.player.trail.forEach((point, index) => {
            this.ctx.fillStyle = `rgba(0, 255, 255, ${index * 0.05})`;
            const yOffset = wobbleActive
              ? Math.sin(point.x * 0.05 + now * 0.002) * 5
              : 0;
            this.ctx.fillRect(
              point.x,
              point.y + yOffset,
              this.player.width,
              this.player.height
            );
          });

          this.ctx.fillStyle =
            this.player.invulnerable > 0 && Math.floor(now / 100) % 2 === 0
              ? "white"
              : this.player.color;
          if (this.levelEffects.includes("chromatic"))
            this.ctx.fillStyle = `hsl(${
              ((this.effects.colorShift * 180) / Math.PI + 180) % 360
            }, 100%, 50%)`;
          drawWobbled(this.player);

          // Render overlays last, before restoring main context
          this.ctx.restore(); // Restore from world transforms
          this.ctx.save(); // New save for overlays
          if (this.levelEffects.includes("scanlines")) this.renderScanlines();
          this.ctx.restore(); // Final restore
        }

        // --- NEW --- Renders scanlines overlay
        renderScanlines() {
          this.ctx.fillStyle = "rgba(0,0,0,0.25)";
          for (let y = 0; y < this.height; y += 4) {
            this.ctx.fillRect(0, y, this.width, 2);
          }
        }

        renderDataBleed() {
          if (this.dataBleedEffects.length === 0) return;
          this.dataBleedEffects.forEach((effect) => {
            const screenX = effect.x - this.camera.x;
            const screenY = effect.y - this.camera.y;
            if (
              screenX > -effect.size &&
              screenX < this.width &&
              screenY > -effect.size &&
              screenY < this.height
            ) {
              const sx = Math.random() * (this.width - effect.size);
              const sy = Math.random() * (this.height - effect.size);
              const opacity = effect.duration / (this.combo >= 5 ? 60 : 20);
              this.ctx.save();
              this.ctx.globalAlpha = opacity * 0.8;
              this.ctx.drawImage(
                this.canvas,
                sx,
                sy,
                effect.size,
                effect.size,
                screenX,
                screenY,
                effect.size,
                effect.size
              );
              this.ctx.restore();
            }
          });
        }

        renderMoireTunnel() {
          this.ctx.fillStyle = "black";
          this.ctx.fillRect(0, 0, this.width, this.height);
          const centerX = this.width / 2;
          const centerY = this.height / 2;
          const progress = (180 - this.transitionTimer) / 180;
          const numRings = 30;
          for (let i = 0; i < numRings; i++) {
            const radius = (numRings - i) * 25 - progress * 25;
            if (radius < 0) continue;
            this.ctx.beginPath();
            this.ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            const hue = (this.transitionTimer + i * 10) % 360;
            const lightness =
              50 + Math.sin(progress * Math.PI * 2 + i * 0.5) * 20;
            this.ctx.strokeStyle = `hsl(${hue}, 100%, ${lightness}%)`;
            this.ctx.lineWidth = 10 + Math.sin(progress * Math.PI + i) * 5;
            this.ctx.stroke();
          }
        }

        updateUI() {
          document.getElementById("lives").textContent = this.lives;
          document.getElementById("score").textContent = this.score;
          document.getElementById("level").textContent = this.currentLevel;
          document.getElementById("combo").textContent = this.combo;
          document.getElementById("progressFill").style.width = `${Math.min(
            100,
            Math.max(0, this.levelProgress)
          )}%`;
        }

        gameLoop() {
          this.animationFrameId = requestAnimationFrame(() => this.gameLoop());
          this.update();
          this.render();
          if (this.gameState === "gameover") {
            cancelAnimationFrame(this.animationFrameId);
            this.animationFrameId = null;
          }
        }
      }

      window.addEventListener("load", () => {
        new PolishedTrippySideScroller();
      });
    </script>
  </body>
</html>
